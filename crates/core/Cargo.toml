[package]
name = "garagedb-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
proptest = "1"
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
automerge = "0.10.0"
