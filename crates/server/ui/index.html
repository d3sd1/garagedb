<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GarageDB</title>
<style>
  :root { --bg:#111; --fg:#f2f2f2; --mut:#9a9a9a; --acc:#2f81f7; --ok:#2ea043; --warn:#d29922; --err:#f85149; --card:#1c1c1c; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:18px/1.45 system-ui,sans-serif; padding-bottom:80px; }
  header { position:sticky; top:0; background:var(--card); padding:10px 14px; display:flex; gap:10px; align-items:center; border-bottom:1px solid #333; z-index:5; }
  header .dot { width:14px; height:14px; border-radius:50%; background:var(--mut); flex:none; }
  header .dot.ok { background:var(--ok); } header .dot.warn { background:var(--warn); }
  header small { color:var(--mut); font-size:14px; }
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid #333; z-index:5; }
  nav button { flex:1; padding:14px 4px; min-height:56px; background:none; border:none; color:var(--mut); font-size:16px; font-weight:600; }
  nav button.active { color:var(--acc); border-top:3px solid var(--acc); }
  main { padding:14px; max-width:760px; margin:0 auto; }
  h2 { font-size:20px; margin:10px 0; }
  input, select, textarea { width:100%; padding:12px; margin:6px 0; font-size:18px; background:#222; color:var(--fg); border:1px solid #444; border-radius:8px; }
  button.act { min-height:48px; padding:10px 18px; font-size:17px; font-weight:700; border:none; border-radius:8px; background:var(--acc); color:#fff; margin:6px 4px 6px 0; }
  button.act.sec { background:#333; }
  button.act.danger { background:var(--err); }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  td, th { padding:10px 6px; border-bottom:1px solid #2c2c2c; text-align:left; font-size:16px; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:14px; font-weight:700; }
  .badge.blocking { background:var(--err); color:#fff; }
  .badge.important { background:var(--warn); color:#111; }
  .badge.optional { background:#333; color:var(--mut); }
  .badge.stale { background:var(--warn); color:#111; }
  .card { background:var(--card); border:1px solid #2c2c2c; border-radius:12px; padding:14px; margin:10px 0; }
  .muted { color:var(--mut); font-size:15px; }
  .qty { font-variant-numeric:tabular-nums; font-weight:700; }
  .hide { display:none; }
  #toast { position:fixed; bottom:70px; left:50%; transform:translateX(-50%); background:#000; border:1px solid #444; padding:10px 18px; border-radius:10px; opacity:0; transition:opacity .3s; max-width:90%; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <span class="dot" id="syncdot"></span>
  <div><strong>GarageDB</strong><br><small id="syncinfo">conectando…</small></div>
</header>
<main>
  <section id="tab-stock">
    <h2>Stock</h2>
    <input id="q" placeholder="Buscar sku, nombre, ubicación, alias…" autocomplete="off">
    <div id="stocklist"></div>
  </section>

  <section id="tab-ingesta" class="hide">
    <h2>Ingesta / Recuento</h2>
    <div class="card">
      <input id="in-sku" placeholder="SKU (ej. M6x20-DIN912)">
      <input id="in-name" placeholder="Nombre">
      <input id="in-loc" placeholder="Ubicación (ej. T2-D07)">
      <select id="in-kind">
        <option value="ingest_exact">Alta: cantidad exacta</option>
        <option value="count_exact">Recuento confirmado (ancla)</option>
        <option value="presence">Nivel: lleno/medio/bajo/vacío</option>
      </select>
      <input id="in-n" type="number" min="0" placeholder="Cantidad" inputmode="numeric">
      <select id="in-level" class="hide">
        <option value="full">Lleno</option><option value="half">Medio</option>
        <option value="low">Bajo</option><option value="empty">Vacío</option>
      </select>
      <button class="act" onclick="submitIngest()">Guardar</button>
    </div>
  </section>

  <section id="tab-misiones" class="hide">
    <h2>Misiones</h2>
    <div id="missionlist"></div>
    <div id="missiondetail"></div>
  </section>

  <section id="tab-sync" class="hide">
    <h2>Sincronización</h2>
    <div class="card" id="syncdetail"></div>
    <button class="act" onclick="doSync()">Sincronizar ahora</button>
    <p class="muted">Tras un git pull / Syncthing / USB, pulsa Sincronizar para incorporar los eventos nuevos. El estado se regenera del log: nunca hay conflictos.</p>
    <div class="card"><h2>Abrir en el móvil</h2><img src="/qr.svg" alt="QR con la URL LAN" style="width:100%;max-width:280px;background:#fff;border-radius:8px;padding:8px"></div>
  </section>
</main>
<nav>
  <button data-tab="stock" class="active">Stock</button>
  <button data-tab="ingesta">Ingesta</button>
  <button data-tab="misiones">Misiones</button>
  <button data-tab="sync">Sync</button>
</nav>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
